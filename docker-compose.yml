# Simplest possible start:  docker compose up
# Then open http://localhost:63317
services:
  microduck:
    image: srayuth089/microduck-docker:latest
    # Loopback only: the lab's API can delete training runs, so it is not
    # something to expose to a network. Use an SSH tunnel for remote access.
    ports:
      - "127.0.0.1:63317:63317"   # the 3D viewer (open this)
      - "127.0.0.1:8788:8788"     # physics + brains (required)
    volumes:
      - microduck-data:/data      # keeps trained policies and captures
    environment:
      # Which brains to load. `docker compose run --rm microduck policies`
      # lists everything available.
      DUCKS: "BEST_alpha_walking BEST_alpha_stand"
    stop_grace_period: 20s

volumes:
  microduck-data:
